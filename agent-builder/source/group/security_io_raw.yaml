title: SecurityIo
description: >
  Concrete I/O targets. Input side auto-grants read permission. Output
  side produces the enforcement output tool — not a generic write permission.
fields:
  conditional:
    io_input_file:
      ref: field/io_input_file__any
      only_when:
        field: .indirect.dispatch.dispatch_input_delivery
        equals: file
    io_input_directory:
      ref: field/io_input_directory__any
      only_when:
        field: .indirect.dispatch.dispatch_input_delivery
        equals: directory
    io_input_tempdir:
      ref: field/io_input_tempdir
      only_when:
        field: .indirect.dispatch.dispatch_input_delivery
        equals: tempfile
    io_scratch_tempdir:
      ref: field/io_scratch_tempdir
      only_when:
        field: .task.processing.scratch_needed
        equals: true
    io_output_file:
      ref: field/io_output_file__any
      only_when:
        field: .task.processing.output_file_name_known
        equals: known
    io_output_directory:
      ref: field/io_output_directory__any
      only_when:
        field: .task.processing.output_file_name_known
        in: [partially, unknown]
