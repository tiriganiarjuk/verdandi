title: Return
description: >
  How the agent returns results. return_mode drives which instruction
  fields the format transformer composes into the prompt.
  Path absolutized after resolution.
fields:
  required:
    return_mode: field/return_mode
  conditional:
    return_status:
      ref: field/return_status
      only_when:
        field: return_mode
        in: [status, status-metrics]
    return_metrics:
      ref: field/return_metrics
      only_when:
        field: return_mode
        in: [status-metrics, metrics-output]
    return_output:
      ref: field/return_output
      only_when:
        field: return_mode
        in: [metrics-output, output]
