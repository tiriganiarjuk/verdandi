title: SecurityIo
description: >
  Concrete I/O targets after path resolution — all paths absolutized.
fields:
  conditional:
    io_input_file:
      ref: field/io_input_file__abs
      only_when:
        field: .indirect.dispatch.dispatch_input_delivery
        equals: file
    io_input_directory:
      ref: field/io_input_directory__abs
      only_when:
        field: .indirect.dispatch.dispatch_input_delivery
        equals: directory
    io_input_tempdir:
      ref: field/io_input_tempdir
      only_when:
        field: .indirect.dispatch.dispatch_input_delivery
        equals: tempfile
    io_scratch_tempdir:
      ref: field/io_scratch_tempdir
      only_when:
        field: .task.processing.scratch_needed
        equals: true
    io_output_file:
      ref: field/io_output_file__abs
      only_when:
        field: .task.processing.output_file_name_known
        equals: known
    io_output_directory:
      ref: field/io_output_directory__abs
      only_when:
        field: .task.processing.output_file_name_known
        in: [partially, unknown]
