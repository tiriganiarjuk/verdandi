title: SecuritySchema
description: >
  Data schema declarations after resolution — schema paths absolutized.
fields:
  optional:
    input_schema: field/input_schema__x_abs
    output_schema: field/output_schema__x_abs
  conditional:
    return_schema:
      ref: field/return_schema__x_abs
      only_when:
        field: .task.return.return_mode
        in: [status-metrics, metrics-output]
    output_schema_embed:
      ref: field/output_schema_embed
      only_when:
        field: output_schema
        exists: true
