title: EnforcementOutputTool
description: >
  Minimal output tool specification assembled by the security resolver.
  Present only when the agent produces structured output (JSON or JSONL).
  Fields drawn from task.processing and security declarations.
fields:
  conditional:
    output_tool_format:
      ref: field/output_tool_format
      only_when:
        field: .task.processing.output_file_format
        in: [jsonl, json, text, markdown]
    output_tool_write_frequency:
      ref: field/output_tool_write_frequency
      only_when:
        field: output_tool_format
        equals: jsonl
    output_tool_batch_size:
      ref: field/output_tool_batch_size
      only_when:
        field: output_tool_write_frequency
        equals: batch
    output_tool_name_needed:
      ref: field/output_tool_name_needed
      only_when:
        field: .task.processing.output_file_name_known
        in: [unknown, partially]
    output_tool_name_pattern:
      ref: field/output_tool_name_pattern
      only_when:
        field: .task.processing.output_file_name_known
        equals: partially
    output_tool_schema_path:
      ref: field/output_tool_schema__x_abs
      always_when:
        field: output_tool_format
        in: [jsonl, json]
    output_tool_file_path:
      ref: field/output_tool_file_path__abs
      only_when:
        field: .task.processing.output_file_name_known
        equals: known
    output_tool_directory_path:
      ref: field/output_tool_directory_path__abs
      only_when:
        field: .task.processing.output_file_name_known
        in: [partially, unknown]
