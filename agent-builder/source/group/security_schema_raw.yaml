title: SecuritySchema
description: >
  Data schema declarations for input and output. Schema validation
  enforcement is a security property.
fields:
  optional:
    input_schema: field/input_schema__x_any
    output_schema: field/output_schema__x_any
    output_schema_embed: field/output_schema_embed
  conditional:
    return_schema:
      ref: field/return_schema__x_abs
      only_when:
        field: .task.return.return_mode
        in: [status-metrics, metrics-output]
