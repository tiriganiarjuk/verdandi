title: SecurityPaths
description: >
  Filesystem path grants at two permission levels. At least one path
  grant must be present. Read-level enables read, search, inspect.
  Write-level enables all capabilities.
fields:
  required:
    paths_workspace: field/workspace_path__x_abs
containers:
  optional:
    paths_allowed_read: simplearray/paths_allowed_read_raw
    paths_allowed_write: simplearray/paths_allowed_write_raw
