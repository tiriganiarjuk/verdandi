title: Processing
description: >
  Output processing configuration — file format, naming, write frequency,
  model capability tier, and scratch space needs.
fields:
  required:
    capability_model: field/agent_capability_model
    output_file_format: field/output_file_format
    output_file_name_known: field/output_file_name_known
    output_description: field/output_description
    scratch_needed: field/scratch_needed
  optional:
    output_file_name_template: field/output_file_name_template
    output_file_name_instruction: field/output_file_name_instruction
    output_batch_size: field/output_batch_size
  conditional:
    output_write_frequency:
      ref: field/output_write_frequency
      only_when:
        field: output_file_format
        equals: jsonl
