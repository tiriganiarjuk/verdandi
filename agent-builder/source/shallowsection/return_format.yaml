title: ReturnFormat
description: >
  How the agent reports results: return mode, optional instructions for
  status/metrics/output, schema for structured returns, and success/failure
  criteria. Aggregates from task.return and criteria sections.
fields:
  required:
    mode: field/return_mode
  optional:
    return_schema: field/return_schema__x_abs
  conditional:
    status_instruction:
      ref: field/status_instruction
      only_when:
        field: mode
        in: [status, status-metrics]
    metrics_instruction:
      ref: field/metrics_instruction
      only_when:
        field: mode
        in: [status-metrics, metrics-output]
    output_instruction:
      ref: field/output_instruction
      only_when:
        field: mode
        in: [metrics-output, output]
