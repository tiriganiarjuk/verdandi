title: ReturnFormat
description: >
  How the agent reports results: return mode, optional instructions for
  status/metrics/output, schema for structured returns, and success/failure
  criteria. Aggregates from task.return and criteria sections.
required:
  mode: field/return_mode
optional:
  status_instruction: field/status_instruction
  metrics_instruction: field/metrics_instruction
  output_instruction: field/output_instruction
  return_schema: field/return_schema__x_abs
containers:
  optional:
    success_criteria: array/success_criteria_reduced
    failure_criteria: array/failure_criteria_reduced
