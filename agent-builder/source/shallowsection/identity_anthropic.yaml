title: IdentityAnthropic
description: >
  Anthropic-resolved agent identity. Same as universal-render identity
  but capability_tier is replaced by the resolved model name. The tier
  is consumed during model resolution and does not appear in the output.
fields:
  required:
    title: field/agent_title
    description: field/agent_description
    role_identity: field/role_identity
    role_responsibility: field/role_responsibility
    model: field/anthropic_model
  optional:
    role_description: field/role_description
containers:
  optional:
    role_expertise: simplearray/role_expertise
