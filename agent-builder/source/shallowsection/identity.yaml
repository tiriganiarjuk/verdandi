title: Identity
description: >
  Agent identity: who it is, what it does, what tier it runs at.
  Title is derived from agent_name (split hyphens, capitalize).
  Capability tier is unresolved — vendor model resolution happens
  at the platform-specific render stage.
fields:
  required:
    title: field/agent_title
    role_identity: field/role_identity
    role_responsibility: field/role_responsibility
  optional:
    role_description: field/role_description
containers:
  optional:
    role_expertise: simplearray/role_expertise
