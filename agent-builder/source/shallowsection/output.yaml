title: Output
description: >
  What the agent produces: format, file location, naming rules, and
  optional schema for validation. Aggregates fields from task.processing,
  security.security_schema, and security.security_io.
required:
  description: field/output_description
  format: field/output_format_kind
  name_known: field/name_known
optional:
  schema_path: field/schema_path__x_abs
  schema_embed: field/schema_embed
  output_file: field/output_file__abs
  output_directory: field/output_directory__abs
  name_template: field/name_template
  name_instruction: field/name_instruction
