title: Agent Raw Definition
version: 3
description: >
  Authored agent definition as it arrives. Entry point to the pipeline
  DAG. Mostly written by an agent rather than by hand, which is why
  incorrect input is blocked and returned here rather than repaired
  downstream. Paths are workspace-relative, includes are file
  references, no computed sections.
sections:
  required:
    indirect: section/indirect
    task: section/task
    security: section/security_raw
    execution: section/execution_raw
  optional:
    criteria: section/criteria_raw
