title: Agent Anthropic Render
version: 1
description: >
  Level 8 vendor branch — Anthropic platform render format. Resolved
  from universal-render: capability_tier mapped to model name, capabilities
  exploded to tool-path pairs, custom output tool discovered, hooks
  built, frontmatter composed. 13 sections: 8 pass-through, 3 modified,
  2 created. implicit_grants consumed during hook building.
shallowsections:
  required:
    dispatcher: shallowsection/dispatcher
    frontmatter: shallowsection/frontmatter
    identity: shallowsection/identity_anthropic
    input: shallowsection/input
    return_format: shallowsection/return_format
    output: shallowsection/output
    instructions: shallowsection/instructions_reduced
    critical_rules: shallowsection/critical_rules
  optional:
    security_boundary: shallowsection/security_boundary_anthropic
    examples: shallowsection/examples_reduced
    constraints: shallowsection/constraints
    anti_patterns: shallowsection/anti_patterns
    success_criteria: shallowsection/success_criteria
    failure_criteria: shallowsection/failure_criteria
    writing_output: shallowsection/writing_output_anthropic
