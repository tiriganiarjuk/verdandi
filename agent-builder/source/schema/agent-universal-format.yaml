title: Agent Universal Format
version: 3
description: >
  Level 6 convergence — merges content branch (includes-merged) with
  permissions branch (permissions-resolved). All includes inlined,
  enforcement computed. Six sections: indirect, task, security,
  execution, criteria, enforcement. Platform-agnostic format for
  render stages.
sections:
  required:
    indirect: section/indirect
    task: section/task
    security: section/security
    execution: section/execution_reduced
    criteria: section/criteria_reduced
    enforcement: section/enforcement
