title: ContextPathAny
type: union/path_any
description: >-
  Path to a context resource file, workspace-relative or absolute. Absolutized
  during the build and added to the agent's Read hook, so prompt awareness and
  permission stay in sync by construction. Whether the resource is mandatory
  or merely offered is carried by the array this item sits in —
  context_required or context_available — never by the path itself.
