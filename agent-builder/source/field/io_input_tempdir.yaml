title: IoInputTempdir
type: atom/kebab_string
min_length: 5
description: >-
  Opaque directory name (a short slug, not a path) for this agent type's temp
  staging area. The dispatcher writes input data to /tmp/{workspace}/{value}/
  and the agent auto-derives read access to that scoped path. Provide only the
  name segment — e.g., "cobalt-stage", not "/tmp/myworkspace/cobalt-stage".
  The format transformer may hash both workspace and value for obfuscation on
  disk. Must not be derived from the agent name or reveal agent structure — if
  names follow a predictable pattern, an adversarial LLM can enumerate temp
  directories for other agent types. Choose an arbitrary, non-descriptive name
  per agent type. Examples: "cobalt-stage", "theta-7" (good); "embedding-
  normalizer-input", "input" (bad — reveals agent identity or is too
  predictable).
constraint:
  - rule: not_equal
    field: security_io_scratch_tempdir
    severity: error
    reason: >-
      Input tempdir (read access) and scratch tempdir (write access) must not
      resolve to the same path. Same value would give the agent write access
      to its input staging area.
