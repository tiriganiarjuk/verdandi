title: ContextPathAbs
type: atom/path_absolute
description: >-
  Absolute path to a context resource, resolved during the build. Used twice:
  the rendered prompt directs the agent to it, and the path is added to the
  agent's Read hook. That dual use is what keeps prompt awareness and
  permission in sync. Whether the resource is mandatory or merely offered is
  carried by the array this item sits in — context_required or
  context_available — never by the path itself.
