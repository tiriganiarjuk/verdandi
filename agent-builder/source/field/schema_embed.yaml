title: SchemaEmbed
type: atom/boolean
description: >-
  Whether the output schema is embedded directly in the agent prompt. The
  decision is authored as data (output_schema_embed) and arrives here already
  made — rendering does not choose it. When true, the schema's content is
  inlined and the read grant is suppressed: the agent sees the schema with no
  tool call. When false, the schema path is granted read access and the agent
  reads it via the Read tool — one round trip, and the content arrives as a
  recent turn. Prefer true for small schemas (under ~100 lines) or when
  adherence is critical. Prefer false for large ones — the cost is not only
  context window: a large inlined block lands mid-prompt where attention is
  weakest, and pushes every later section further into that same trough.
  Which way is better for a given schema is worth building both ways and
  testing.
