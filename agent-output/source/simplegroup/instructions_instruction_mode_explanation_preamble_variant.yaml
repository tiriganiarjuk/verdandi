title: InstructionsInstructionModeExplanationPreambleVariant
description: >-
  Variant alternatives for the instruction mode explanation.
  Keys represent the mode composition of the step list. The
  selector is computed from data (mixed vs uniform modes),
  not from a structure toggle.
required:
  mixed: field/instructions_instruction_mode_explanation_preamble_variant_mixed
  uniform_deterministic: field/instructions_instruction_mode_explanation_preamble_variant_uniform_deterministic
  uniform_probabilistic: field/instructions_instruction_mode_explanation_preamble_variant_uniform_probabilistic
