title: Agent Output Content
version: 1
description: >-
  Content surface schema for agent output rendering. Contains every
  piece of non-data text: headings, prose templates, variant
  sub-tables. Swap this file to test different prose framings while
  keeping structure and display constant.
shallowsections:
  required:
    identity: shallowsection/identity_content
    security_boundary: shallowsection/security_boundary_content
    critical_rules: shallowsection/critical_rules_content
    instructions: shallowsection/instructions_content
    examples: shallowsection/examples_content
    constraints: shallowsection/constraints_content
    anti_patterns: shallowsection/anti_patterns_content
    success_criteria: shallowsection/success_criteria_content
    failure_criteria: shallowsection/failure_criteria_content
    output: shallowsection/output_content
    writing_output: shallowsection/writing_output_content
    return_format: shallowsection/return_format_content
