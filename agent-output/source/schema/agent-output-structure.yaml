title: Agent Output Structure
version: 1
description: >-
  Structure surface schema for agent output rendering. Controls what
  renders and which variant of content to use. Visibility toggles,
  variant selectors, override gates, and presentation modes across
  all 12 sections.
shallowsections:
  required:
    section_order: shallowsection/section_order_structure
    identity: shallowsection/identity_structure
    security_boundary: shallowsection/security_boundary_structure
    input: shallowsection/input_structure
    critical_rules: shallowsection/critical_rules_structure
    instructions: shallowsection/instructions_structure
    examples: shallowsection/examples_structure
    constraints: shallowsection/constraints_structure
    anti_patterns: shallowsection/anti_patterns_structure
    success_criteria: shallowsection/success_criteria_structure
    failure_criteria: shallowsection/failure_criteria_structure
    output: shallowsection/output_structure
    writing_output: shallowsection/writing_output_structure
    return_format: shallowsection/return_format_structure
