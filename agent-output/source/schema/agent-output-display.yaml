title: Agent Output Display
version: 1
description: >-
  Display surface schema for agent output rendering. Controls visual
  formatting: list styles, thresholds, separators, containers, and
  inline formats. Independent of both structure and content. Global
  defaults apply across all sections unless overridden.
shallowsections:
  required:
    global_defaults: shallowsection/global_defaults_display
    identity: shallowsection/identity_display
    security_boundary: shallowsection/security_boundary_display
    input: shallowsection/input_display
    critical_rules: shallowsection/critical_rules_display
    instructions: shallowsection/instructions_display
    examples: shallowsection/examples_display
    constraints: shallowsection/constraints_display
    anti_patterns: shallowsection/anti_patterns_display
    success_criteria: shallowsection/success_criteria_display
    failure_criteria: shallowsection/failure_criteria_display
    output: shallowsection/output_display
    writing_output: shallowsection/writing_output_display
    return_format: shallowsection/return_format_display
