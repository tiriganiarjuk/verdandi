title: FailureCriteriaStructure
description: >-
  Structure controls for the failure criteria section. Master
  visibility, entry limit, visibility toggles, and abort stance
  variant conditional on preamble visibility.
fields:
  required:
    section_visible: field/failure_criteria_section_visible
    max_entries_rendered: field/failure_criteria_max_entries_rendered
    abort_stance_preamble_visible: field/failure_criteria_abort_stance_preamble_visible
    cite_definition_and_evidence_postscript_visible: field/failure_criteria_cite_definition_and_evidence_postscript_visible
    check_before_and_during_postscript_visible: field/failure_criteria_check_before_and_during_postscript_visible
  conditional:
    abort_stance_preamble_p_variant:
      ref: field/failure_criteria_abort_stance_variant
      only_when:
        field: abort_stance_preamble_visible
        equals: true
    abort_stance_definition_label_b_variant:
      ref: field/failure_criteria_abort_stance_variant
      only_when:
        field: abort_stance_preamble_visible
        equals: true
