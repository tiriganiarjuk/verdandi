title: ConstraintsDisplay
description: >-
  Display formatting for the constraints section. Enumeration format
  with threshold, visibility thresholds for closing reminder and
  count heading, must normalization, and polarity grouping threshold.
fields:
  required:
    constraints_rules_format: field/constraints_rules_format
    constraints_rules_format_threshold: field/constraints_rules_format_threshold
    constraints_compliance_reminder_closing_visibility_threshold: field/constraints_compliance_reminder_closing_visibility_threshold
    constraints_constraint_count_heading_visibility_threshold: field/constraints_constraint_count_heading_visibility_threshold
    constraints_rules_polarity_normalization: field/constraints_rules_polarity_normalization
    constraints_rules_polarity_grouping_threshold: field/constraints_rules_polarity_grouping_threshold
  optional:
    constraints_pre_section_divider_override: field/constraints_pre_section_divider_override
    constraints_pre_body_entry_separator_override: field/constraints_pre_body_entry_separator_override
