    closing_compliance_reminder_visibility_threshold: field/constraints_closing_compliance_reminder_visibility_threshold
    constraint_count_heading_visibility_threshold: field/constraints_constraint_count_heading_visibility_threshold
    must_vs_must_not_normalization: field/constraints_must_vs_must_not_normalization
    polarity_grouping_activation_threshold: field/constraints_polarity_grouping_activation_threshold
