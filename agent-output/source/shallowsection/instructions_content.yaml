    no_extra_operations_preamble: field/instructions_no_extra_operations_preamble
    step_done_when_postscript: field/instructions_step_done_when_postscript
    cross_step_dependency_label: field/instructions_cross_step_dependency_label
    reminder_midpoint: field/instructions_reminder_midpoint
    guardrail_closing: field/instructions_guardrail_closing
    instruction_mode_recap_closing: field/instructions_instruction_mode_recap_closing
containers:
