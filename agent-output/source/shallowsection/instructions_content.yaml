title: InstructionsContent
description: >-
  Content prose for the instructions section. Preamble components,
  per-step mode templates (via instruction_mode sub-table), mode
  explanation variant, dependency phrases, closer text, and heading
  variant sub-table.
fields:
  required:
    instructions_preamble_step_count: field/instructions_preamble_step_count
    instructions_preamble_no_add_skip_reorder: field/instructions_preamble_no_add_skip_reorder
    instructions_preamble_instruction_mode_preview: field/instructions_preamble_instruction_mode_preview
    instructions_preamble_no_extra_operations: field/instructions_preamble_no_extra_operations
    step_done_when_suffix: field/instructions_step_done_when_suffix
    cross_step_dependency_phrases: field/instructions_cross_step_dependency_phrases
    halfway_point_reminder: field/instructions_halfway_point_reminder
    section_closer_guardrail: field/instructions_section_closer_guardrail
    section_closer_instruction_mode_recap: field/instructions_section_closer_instruction_mode_recap
containers:
  required:
    heading_variant: simplegroup/instructions_heading_variant
    instruction_mode: group/instructions_instruction_mode_content
    instruction_mode_explanation_variant: simplegroup/instructions_instruction_mode_explanation_variant
