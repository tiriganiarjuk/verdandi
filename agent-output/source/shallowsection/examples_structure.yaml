title: ExamplesStructure
description: >-
  Structure controls for the examples section. Preamble visibility,
  group heading suppression, override toggles with conditional
  override values, and framing sentence toggle.
fields:
  required:
    section_preamble_visible: field/examples_section_preamble_visible
    groups_suppress_lone_heading: field/examples_groups_suppress_lone_heading
    groups_display_headings_override: field/examples_groups_display_headings_override
    groups_max_number_override: field/examples_groups_max_number_override
    group_framing_preamble_template_visible: field/examples_group_framing_preamble_template_visible
  conditional:
    groups_display_headings:
      ref: field/examples_groups_display_headings
      only_when:
        field: groups_display_headings_override
        equals: true
    groups_max_number:
      ref: field/examples_groups_max_number
      only_when:
        field: groups_max_number_override
        equals: true
