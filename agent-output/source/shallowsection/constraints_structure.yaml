title: ConstraintsStructure
description: >-
  Structure controls for the constraints section. Master visibility,
  entry limit, visibility toggles, and variant selectors conditional
  on their paired visibility toggle.
fields:
  required:
    constraints_pre_section_visible: field/constraints_pre_section_visible
    constraints_pre_max_entries_rendered: field/constraints_pre_max_entries_rendered
    constraints_section_preamble_visible: field/constraints_section_preamble_visible
    constraints_constraints_are_not_steps_preamble_visible: field/constraints_constraints_are_not_steps_preamble_visible
    constraints_no_inferred_constraints_preamble_visible: field/constraints_no_inferred_constraints_preamble_visible
    constraints_compliance_reminder_closing_visible: field/constraints_compliance_reminder_closing_visible
    constraints_constraint_count_heading_visible: field/constraints_constraint_count_heading_visible
    constraints_hierarchy_tier_comparison_preamble_visible: field/constraints_hierarchy_tier_comparison_preamble_visible
    constraints_hierarchy_three_tier_explanation_preamble_visible: field/constraints_hierarchy_three_tier_explanation_preamble_visible
  conditional:
    constraints_section_preamble_selector:
      ref: field/constraints_section_preamble_selector
      only_when:
        field: constraints_section_preamble_visible
        equals: true
    constraints_compliance_reminder_closing_selector:
      ref: field/constraints_compliance_reminder_closing_selector
      only_when:
        field: constraints_compliance_reminder_closing_visible
        equals: true
    constraints_no_inferred_constraints_preamble_selector:
      ref: field/constraints_no_inferred_constraints_preamble_selector
      only_when:
        field: constraints_no_inferred_constraints_preamble_visible
        equals: true
