    input_context_required_format: field/input_context_required_format
    input_context_available_format: field/input_context_available_format
    input_parameters_format: field/input_parameters_format
    input_parameters_format_threshold: field/input_parameters_format_threshold
  optional:
    input_pre_section_divider_override: field/input_pre_section_divider_override
    input_pre_body_entry_separator_override: field/input_pre_body_entry_separator_override
