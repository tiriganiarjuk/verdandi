title: ConstraintsVariantContent
description: >-
  Wrapper group for all constraints variant sub-tables. Contains
  three content families (section_preamble, closing_compliance_reminder,
  no_inferred_constraints) that each have variant alternatives selected
  by structure.
containers:
  required:
    section_preamble_variant: simplegroup/constraints_section_preamble_variant
    closing_compliance_reminder_variant: simplegroup/constraints_closing_compliance_reminder_variant
    no_inferred_constraints_variant: simplegroup/constraints_no_inferred_constraints_variant
