title: InstructionsInstructionModeContent
description: >-
  Shared variant content for instruction mode per-step templates.
  Contains four role families (header, header_n_only, body_prefix,
  signal_at_mode_change) that are all keyed by instruction_mode
  enum values. The engine finds the enum field in step data, looks
  up the mode value in each role sub-table, and renders in
  declaration order. Structure selector step_index_tracking
  chooses between header and header_n_only.
containers:
  required:
    header: simplegroup/instructions_instruction_mode_header
    header_n_only: simplegroup/instructions_instruction_mode_header_n_only
    body_prefix: simplegroup/instructions_instruction_mode_body_prefix
    signal_at_mode_change: simplegroup/instructions_instruction_mode_signal_at_mode_change
