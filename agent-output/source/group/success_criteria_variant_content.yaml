title: SuccessCriteriaVariantContent
description: >-
  Wrapper group for all success criteria variant sub-tables. Contains
  three content families (definition_framing, evidence_framing,
  definition_to_evidence_transition) that each have variant alternatives
  selected by structure.
containers:
  required:
    definition_framing_variant: simplegroup/success_criteria_definition_framing_variant
    evidence_framing_variant: simplegroup/success_criteria_evidence_framing_variant
    definition_to_evidence_transition_variant: simplegroup/success_criteria_definition_to_evidence_transition_variant
