title: GuardrailsAntiPatterns
type: atom/string_plain
description: >-
  Common mistakes to avoid. Each entry describes a specific wrong behavior the
  agent might exhibit and why it's wrong. "Do not batch-summarize from memory
  — process each record individually from the source file", "Do not infer
  missing fields — mark them as absent". Anti-patterns are learned from
  observed agent failures.
semantic:
  intent: >-
    Calibrates the LLM against its own failure modes. Each item must describe
    a specific, recognizable mistake — not a generic warning.
  checks:
    - >-
      Each item describes a specific mistake, not a category of mistakes
    - >-
      Each item is recognizable — agent can detect when it is about to do this
    - >-
      Items are grounded in observed LLM failure modes, not hypothetical risks
  severity: warning
