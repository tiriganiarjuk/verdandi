title: PathsAllowedReadAny
type: union/path_any
description: >-
  WARNING — MOST AGENTS DO NOT NEED THIS. Read permissions for input files,
  context resources, schemas, and temp directories are ALL AUTO-DERIVED from
  their respective declarations. Adding them here is REDUNDANT and indicates
  a misunderstanding of the security model. THIS IS ONLY FOR additional
  workspace paths the agent reads that are NOT declared anywhere else — e.g.,
  reference data directories, shared configuration files, library sources.
  If every path you want to add here is already declared in security_io,
  security_schema, or context, LEAVE THIS EMPTY. Each entry grants recursive
  read-level access to all files under the prefix. Entries can be workspace-
  relative or absolute. Actual capabilities granted depend on intersection
  with security_capabilities_requested.
