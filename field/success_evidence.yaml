title: SuccessEvidence
type: atom/string_plain
description: >-
  Observable conditions that prove success. Each entry is a concrete,
  verifiable statement the agent can check. "Output record count equals input
  record count", "Every record passes schema validation". These become the
  agent's self-verification checklist.
semantic:
  intent: >-
    Self-verification checklist. The agent checks each condition after
    processing to confirm success before reporting.
  checks:
    - >-
      Each item is a concrete, observable condition — not a subjective
      judgment
    - >-
      Each item is independently verifiable from outputs alone
    - >-
      Conditions are sufficient — if all pass, success is confirmed
  severity: warning
