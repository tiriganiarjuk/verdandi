type: atom/string_plain
description: >-
  MUST and NEVER rules the agent must follow. Each entry is a single
  imperative constraint. "MUST validate every record against schema before
  writing", "NEVER modify source data", "MUST process records in order". Keep
  constraints specific and verifiable — vague rules get ignored.
semantic:
  intent: >-
    Hard behavioral boundaries in the agent prompt. Violations are agent
    failures. Each item must be clear enough that both the agent AND a
    reviewer can determine whether a specific output violates it.
  checks:
    - >-
      Each item is actionable — agent can determine compliance from the
      constraint alone
    - >-
      Each item is verifiable — a reviewer can check violation without
      ambiguity
    - >-
      Items are specific to this agent's failure modes, not generic good
      practice
  anti_patterns:
    - >-
      Vague directives: 'be careful', 'ensure quality', 'be thorough'
    - >-
      Constraints the agent cannot actually verify or enforce
  severity: warning
