title: PathsAllowedWriteAbs
type: atom/path_absolute
description: >-
  Path prefixes granting write-level access for general workspace work (post-
  resolution absolute paths). Each entry validated against the blocklist.
  Write-level paths make all capabilities possible (write, edit, append, read,
  search, inspect) within these paths. Which capabilities are actually granted
  depends on capabilities_requested intersection. Does not include auto-
  derived write paths from IO declarations or temp/scratch directories — those
  are computed separately by the security resolver. Output paths must never
  appear here — that bypasses enforcement output tool constraints.
