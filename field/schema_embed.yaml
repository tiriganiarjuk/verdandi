type: atom/boolean
description: >-
  Whether to embed the output schema directly into the agent prompt. When
  true, the format transformer reads the schema file and inlines its content —
  uses context window but ensures the agent sees the schema without a tool
  call. When false (or omitted), the schema path is granted read access and
  the agent reads it via Read tool — saves context but adds a tool-call round
  trip. Prefer true for small schemas (under ~100 lines) or when schema
  adherence is critical. Prefer false for large schemas where context window
  conservation matters. Either way the agent knows the desired shape.
