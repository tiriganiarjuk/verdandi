description: >
  Output processing configuration — file format, naming, write frequency,
  model capability tier, and scratch space needs.
fields:
  required:
    processing_capability_model: enum/processing_capability
    processing_output_file_format: enum/output_format_kind
    processing_output_file_name_known: enum/output_name_known
    processing_output_description: atom/string_plain
  optional:
    processing_scratch_needed: atom/boolean
    processing_output_file_name_template: atom/string_plain
    processing_output_file_name_instruction: atom/string_plain
    processing_output_batch_size: atom/integer
  conditional:
    processing_output_write_frequency:
      ref: enum/write_frequency
      only_when:
        field: processing_output_file_format
        equals: jsonl
