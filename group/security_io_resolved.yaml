title: SecurityIo
description: >
  Concrete I/O targets after path resolution — all paths absolutized.
fields:
  conditional:
    security_io_input_file:
      ref: field/io_input_file__abs
      only_when:
        field: indirect.dispatch.dispatch_input_delivery
        equals: file
    security_io_input_directory:
      ref: field/io_input_directory__abs
      only_when:
        field: indirect.dispatch.dispatch_input_delivery
        equals: directory
    security_io_input_tempdir:
      ref: field/io_input_tempdir
      only_when:
        field: indirect.dispatch.dispatch_input_delivery
        equals: tempfile
    security_io_scratch_tempdir:
      ref: field/io_scratch_tempdir
      only_when:
        field: task.processing.processing_scratch_needed
        equals: true
    security_io_output_file:
      ref: field/io_output_file__abs
      only_when:
        field: task.processing.processing_output_file_name_known
        equals: known
    security_io_output_directory:
      ref: field/io_output_directory__abs
      only_when:
        field: task.processing.processing_output_file_name_known
        in: [partially, unknown]
